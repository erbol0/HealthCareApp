# Spring Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/medical_topics_db
spring.datasource.username=postgres
spring.datasource.password=Erbol
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring MVC properties for multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Cloudinary Configuration
cloudinary.cloud_name=your_actual_cloud_name
cloudinary.api_key=your_actual_api_key
cloudinary.api_secret=your_actual_api_secret

# Logging
logging.level.org.springframework.web=DEBUG
# Corrected line below:
logging.level.com.example.medicaltopic=DEBUG

# Server Port
server.port=8080

# Springdoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html